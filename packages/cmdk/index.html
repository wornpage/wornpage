<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@wornpage/cmdk demo</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f0e8; color: #21322b; font-family: system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 18px; font-size: 24px; }
  button { min-height: 40px; padding: 8px 16px; border: 1px solid #d6d0c7; border-radius: 6px; background: #fdfbf7; color: inherit; cursor: pointer; font-size: 14px; }
  button:hover { border-color: #0d9488; background: #eaf4f0; }
  button:focus-visible { outline: 2px dashed #0d9488; outline-offset: 2px; }
  output { display: block; min-height: 20px; margin-top: 14px; color: #506058; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>@wornpage/cmdk</h1>
  <button id="open-btn" type="button" aria-keyshortcuts="Control+K Meta+K">Open command palette</button>
  <output id="selection" aria-live="polite"></output>
</main>
<worn-cmdk id="cmdk"></worn-cmdk>

<script type="module" src="./dist/worn-cmdk.js"></script>
<script type="module">
  const cmdk = document.getElementById('cmdk');
  const selection = document.getElementById('selection');
  const select = (label) => { selection.textContent = label; };

  cmdk.items = [
    { id: 'home', label: 'Go to Home', hint: 'Screen', onSelect: () => select('Home selected') },
    { id: 'work', label: 'View Work Items', hint: '3 packs', keywords: ['tasks'], onSelect: () => select('Work selected') },
    { id: 'review', label: 'Needs Review', hint: 'Blocked', keywords: ['blocked'], onSelect: () => select('Review selected') },
    { id: 'theme', label: 'Toggle Dark Mode', hint: 'Action', keywords: ['dark'], group: 'Actions', onSelect: () => select('Theme selected') },
    { id: 'reset', label: 'Reset All Data', hint: 'Danger', keywords: ['clear'], group: 'Actions', onSelect: () => select('Reset selected') }
  ];
  cmdk.placeholder = 'Search pages, packs...';

  document.getElementById('open-btn').addEventListener('click', () => cmdk.open());
  document.addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'k') {
      event.preventDefault();
      cmdk.open();
    }
  });
</script>
</body>
</html>
