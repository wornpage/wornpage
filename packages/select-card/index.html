<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@wornpage/select-card</title>
  <style>
    :root {
      color-scheme: light dark;
      --cockpit-accent: #0f766e;
      --cockpit-accent-text: #fff;
      --cockpit-bg: #f5f0e8;
      --cockpit-bg-secondary: #eee9e1;
      --cockpit-border: #d8d2c8;
      --cockpit-border-strong: #8c9a93;
      --cockpit-radius: 6px;
      --cockpit-surface: #fdfbf7;
      --cockpit-surface-raised: #f4f0e9;
      --cockpit-text: #21322b;
      --cockpit-text-muted: #52645c;
      --cockpit-text-secondary: #374b42;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cockpit-accent: #2f7665;
        --cockpit-bg: #101814;
        --cockpit-bg-secondary: #17221d;
        --cockpit-border: #3a4d45;
        --cockpit-border-strong: #82988e;
        --cockpit-surface: #18241f;
        --cockpit-surface-raised: #223129;
        --cockpit-text: #f7fffc;
        --cockpit-text-muted: #b0bcb4;
        --cockpit-text-secondary: #dce8e2;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--cockpit-bg);
      color: var(--cockpit-text);
      font-family: system-ui, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 18px; font-size: 24px; letter-spacing: 0; }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    worn-select-card { display: block; min-width: 0; }
    worn-select-card .worn-select-card { inline-size: 100%; }
    @media (max-width: 520px) { .options { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>@wornpage/select-card</h1>
    <div class="options" role="group" aria-label="Workspace plan">
      <worn-select-card data-option="free" label="Free" description="Personal workspace"></worn-select-card>
      <worn-select-card data-option="pro" label="Pro" description="Larger limits" pressed></worn-select-card>
      <worn-select-card data-option="team" label="Team" description="Shared workspace and SSO"></worn-select-card>
      <worn-select-card label="Legacy" description="No longer offered" disabled></worn-select-card>
    </div>
  </main>
  <script type="module" src="./dist/worn-select-card.js"></script>
  <script type="module">
    const cards = [...document.querySelectorAll('[data-option]')];
    for (const card of cards) card.addEventListener('click', () => {
      for (const option of cards) option.pressed = option === card;
    });
  </script>
</body>
</html>
