<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@wornpage/scenarios — Demo</title>
  <style>
    body { font-family: system-ui; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .card .icon { font-size: 24px; }
    .card strong { display: block; }
    .card p { margin: 2px 0 0; color: #666; font-size: 13px; }
    .valid { background: #e8f5e9; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .invalid { background: #ffebee; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>@wornpage/scenarios</h1>
  <p>Shared scenario definitions for wornpage demo apps. Valid scenario IDs and method card data.</p>

  <h2>Valid Scenarios</h2>
  <div id="valid-list"></div>

  <h2>Welcome Methods</h2>
  <div id="welcome-list"></div>

  <h2>Method Cards</h2>
  <div id="cards-list"></div>

  <script type="module">
    const VALID_SCENARIOS = new Set(['default','due-view','empty','healthy','onboarding','review','ai-prompts','ai-evals','ops-day','sales','ai-companion']);
const WELCOME_METHODS = [{id:'ops-day',label:'Daily Operations',desc:'Restock, payroll, maintenance, onboarding.',icon:'🏪',route:'/review'},{id:'ai-prompts',label:'Prompt Engineering',desc:'Library, evals, model comparison, agent chains.',icon:'🤖',route:'/review'},{id:'sales',label:'Sales Pipeline',desc:'Prospect, qualify, close. Track owners, blockers, next actions.',icon:'💰',route:'/review'},{id:'default',label:'Project Work',desc:'Blocker management, next actions, proof targets, memory notes.',icon:'📋',route:'/work'},{id:'empty',label:'Start from scratch',desc:'Blank canvas. Your vocabulary, your workflow.',icon:'✨',route:'/review'}];
const METHOD_CARDS = [{id:'ops-day',label:'Daily Operations',desc:'Restock, payroll, maintenance, onboarding.',icon:'🏪',route:'/review'},{id:'ai-prompts',label:'Prompt Engineering',desc:'Prompt library, evals, model comparison.',icon:'🤖',route:'/review'},{id:'sales',label:'Sales Pipeline',desc:'Prospect, qualify, and close leads.',icon:'💰',route:'/review'},{id:'ai-companion',label:'AI Companion',desc:'Emotional support, pragmatic guidance, stoic presence.',icon:'🎭',route:'/work'},{id:'default',label:'Project Work',desc:'General-purpose blocker and next-action tracking.',icon:'📋',route:'/work'}];
    
    function renderList(el, items) {
      el.innerHTML = items.map(m => "<div class='card'><span class='icon'>" + m.icon + "</span><div><strong>" + m.label + "</strong><p>" + m.desc + "</p><span class='valid'>✓ valid</span></div></div>").join('');
    }
    
    document.getElementById('valid-list').innerHTML = "<p>" + [...VALID_SCENARIOS].join(', ') + "</p>";
    renderList(document.getElementById('welcome-list'), WELCOME_METHODS);
    renderList(document.getElementById('cards-list'), METHOD_CARDS);
  </script>
</body>
</html>
