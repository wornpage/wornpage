<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@wornpage/toast demo</title>
<style>
  body { margin: 0; padding: 32px; background: #f5f0e8; color: #21322b; font-family: system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 18px; font-size: 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  button { min-height: 40px; padding: 8px 16px; border: 1px solid #d6d0c7; border-radius: 6px; background: #fdfbf7; color: inherit; cursor: pointer; font-size: 14px; }
  button:hover { border-color: #0d9488; background: #eaf4f0; }
  button:focus-visible { outline: 2px dashed #0d9488; outline-offset: 2px; }
  #container { position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; width: min(300px, calc(100vw - 40px)); flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<main>
  <h1>@wornpage/toast</h1>
  <div class="controls">
    <button type="button" data-kind="info">Info</button>
    <button type="button" data-kind="success">Success</button>
    <button type="button" data-kind="error">Error</button>
    <button type="button" data-kind="long">Long message</button>
  </div>
</main>
<div id="container" aria-label="Notifications"></div>

<script type="module" src="./dist/worn-toast.js"></script>
<script type="module">
  const container = document.getElementById('container');
  const messages = {
    info: 'Background sync started',
    success: 'Changes saved',
    error: 'Could not save changes',
    long: 'DeploymentEvidenceForCustomerWorkspaceWithAnExceptionallyLongUnbrokenIdentifier'
  };

  function showToast(kind) {
    const toast = document.createElement('worn-toast');
    toast.message = messages[kind];
    toast.kind = kind === 'long' ? 'info' : kind;
    toast.dismissLabel = `Dismiss notification: ${messages[kind]}`;
    toast.duration = 0;
    toast.addEventListener('worn-dismiss', () => toast.remove());
    container.appendChild(toast);
  }

  document.querySelectorAll('[data-kind]').forEach((button) => {
    button.addEventListener('click', () => showToast(button.dataset.kind));
  });
</script>
</body>
</html>
