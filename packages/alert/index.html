<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wornpage Alert</title>
  <style>
    :root {
      --worn-bg: #f5f0e8;
      --worn-surface: #fdfbf7;
      --worn-border: #d0cac1;
      --worn-text: #21322b;
      --worn-accent: #0f766e;
      --worn-accent-50: #e1f3ee;
      --worn-success-bg: #e7f6ec;
      --worn-success-border: #27824c;
      --worn-success-text: #174f30;
      --worn-warning-bg: #fff3cd;
      --worn-warning-border: #9a6b00;
      --worn-warning-text: #5f4300;
      --worn-danger-bg: #fce8e7;
      --worn-danger-border: #b42318;
      --worn-danger-text: #7a1a14;
      --worn-radius: 6px;
      --font-typewriter: ui-monospace, SFMono-Regular, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --worn-bg: #0f1714;
        --worn-surface: #18241f;
        --worn-border: #3a4d45;
        --worn-text: #f7fffc;
        --worn-accent: #5cc8a9;
        --worn-accent-50: #153e35;
        --worn-success-bg: #173b28;
        --worn-success-border: #5bc487;
        --worn-success-text: #d8f8e5;
        --worn-warning-bg: #403612;
        --worn-warning-border: #d9af36;
        --worn-warning-text: #fff2bd;
        --worn-danger-bg: #451f1c;
        --worn-danger-border: #ed786f;
        --worn-danger-text: #ffe0dd;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--worn-bg); color: var(--worn-text); font-family: Georgia, serif; }
    main { max-inline-size: 620px; margin: 0 auto; }
    h1 { margin: 0 0 18px; font-size: 28px; }
    .states { display: grid; gap: 2px; min-inline-size: 0; }
    .narrow { max-inline-size: 280px; min-inline-size: 0; }
    output { display: block; min-block-size: 22px; margin-top: 12px; font: 12px/1.5 var(--font-typewriter); }
    @media (max-width: 380px) { body { padding: 14px; } }
  </style>
  <script type="module" src="./dist/worn-alert.js"></script>
</head>
<body>
  <main>
    <h1>Alert</h1>
    <section class="states" aria-label="Alert states">
      <worn-alert tone="info" title="Sync scheduled">Next run at 14:30.</worn-alert>
      <worn-alert tone="success" title="Saved">Changes saved.</worn-alert>
      <worn-alert tone="warning" title="Review needed">Two checks remain.</worn-alert>
      <worn-alert tone="danger" title="Deployment failed">Check the build logs and retry.</worn-alert>
      <div class="narrow">
        <worn-alert tone="warning" dismissible title="DeploymentEvidenceForCustomerWorkspaceWithAnExceptionallyLongUnbrokenIdentifier">ArchitectureVerificationAndReleaseEvidenceWithoutBreakpoints</worn-alert>
      </div>
    </section>
    <output aria-live="polite">No alerts dismissed.</output>
  </main>
  <script>
    document.addEventListener('dismiss', (event) => {
      document.querySelector('output').textContent = `Dismissed: ${event.target.getAttribute('title') || 'alert'}`;
    });
  </script>
</body>
</html>
