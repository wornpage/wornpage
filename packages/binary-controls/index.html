<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wornpage Binary Controls</title>
  <style>
    :root {
      --worn-bg: #f5f0e8;
      --worn-bg-secondary: #ece6dd;
      --worn-surface: #fdfbf7;
      --worn-border: #e2ddd5;
      --worn-border-strong: #d0cac1;
      --worn-text: #21322b;
      --worn-text-muted: #506058;
      --worn-accent: #0f766e;
      --worn-accent-text: #fff;
      --font-typewriter: ui-monospace, SFMono-Regular, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --worn-bg: #0f1714;
        --worn-bg-secondary: #131e19;
        --worn-surface: #18241f;
        --worn-border: #3a4d45;
        --worn-border-strong: #4d5c52;
        --worn-text: #f7fffc;
        --worn-text-muted: #b0bcb4;
        --worn-accent: #2f7665;
        --worn-accent-text: #fff;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--worn-bg); color: var(--worn-text); font-family: Georgia, serif; }
    main { max-width: 620px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: var(--worn-text-muted); }
    .surface { border-block: 1px solid var(--worn-border); padding-block: 8px; }
    .row { display: grid; grid-template-columns: minmax(76px, 0.38fr) minmax(0, 1fr); align-items: center; gap: 12px; min-height: 62px; border-block-end: 1px solid var(--worn-border); }
    .row:last-child { border-block-end: 0; }
    .state { font: 700 11px/1 var(--font-typewriter); text-transform: uppercase; color: var(--worn-text-muted); }
    .narrow { max-width: 230px; }
    output { display: block; margin-top: 16px; min-height: 22px; font: 12px/1.5 var(--font-typewriter); color: var(--worn-text-muted); }
    @media (max-width: 380px) { body { padding: 14px; } }
  </style>
  <script type="module" src="./dist/worn-binary-controls.js"></script>
</head>
<body>
  <main>
    <h1>Binary controls</h1>
    <p>Native state controls for compact, themeable product surfaces.</p>
    <section class="surface" aria-label="Binary control states">
      <div class="row"><span class="state">Checked</span><worn-checkbox checked label="Include archived"></worn-checkbox></div>
      <div class="row"><span class="state">Unchecked</span><worn-checkbox label="Notify owner"></worn-checkbox></div>
      <div class="row"><span class="state">Switch on</span><worn-switch checked label="Email updates"></worn-switch></div>
      <div class="row"><span class="state">Switch off</span><worn-switch label="Dark mode"></worn-switch></div>
      <div class="row"><span class="state">Disabled</span><worn-switch checked disabled label="Billing managed"></worn-switch></div>
      <div class="row"><span class="state">Icon only</span><worn-checkbox aria-label="Complete subtask"></worn-checkbox></div>
      <div class="row"><span class="state">Long label</span><div class="narrow"><worn-checkbox label="Include every archived item assigned to this workspace"></worn-checkbox></div></div>
    </section>
    <output id="state" aria-live="polite">No changes yet.</output>
  </main>
  <script>
    const output = document.querySelector('#state');
    document.addEventListener('change', (event) => {
      if (!event.target.matches('worn-checkbox, worn-switch')) return;
      output.textContent = `${event.target.localName}: ${event.detail.checked ? 'on' : 'off'}`;
    });
  </script>
</body>
</html>
