<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wornpage Form Fields</title>
  <style>
    :root {
      --cockpit-bg: #f5f0e8;
      --cockpit-bg-secondary: #ece6dd;
      --cockpit-surface: #fdfbf7;
      --cockpit-border: #e2ddd5;
      --cockpit-border-strong: #d0cac1;
      --cockpit-text: #21322b;
      --cockpit-text-secondary: #394b43;
      --cockpit-text-muted: #506058;
      --cockpit-accent: #0f766e;
      --cockpit-accent-50: rgb(15 118 110 / 0.18);
      --font-typewriter: ui-monospace, SFMono-Regular, Consolas, monospace;
      --cockpit-radius-sm: 6px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cockpit-bg: #0f1714;
        --cockpit-bg-secondary: #121c18;
        --cockpit-surface: #18241f;
        --cockpit-border: #3a4d45;
        --cockpit-border-strong: #4d5c52;
        --cockpit-text: #f7fffc;
        --cockpit-text-secondary: #d9e5dd;
        --cockpit-text-muted: #b0bcb4;
        --cockpit-accent: #5cc8a9;
        --cockpit-accent-50: rgb(92 200 169 / 0.18);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--cockpit-bg); color: var(--cockpit-text); font-family: Georgia, serif; }
    main { max-width: 620px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: var(--cockpit-text-muted); }
    .surface { display: grid; gap: 14px; border-block: 1px solid var(--cockpit-border); padding-block: 16px; }
    label { display: grid; gap: 5px; min-inline-size: 0; color: var(--cockpit-text-secondary); font: 700 11px/1.2 var(--font-typewriter); text-transform: uppercase; }
    .compact { max-inline-size: 280px; }
    output { display: block; margin-top: 16px; min-height: 22px; font: 12px/1.5 var(--font-typewriter); color: var(--cockpit-text-muted); }
    @media (max-width: 380px) { body { padding: 14px; } }
  </style>
  <script type="module" src="./dist/worn-form-fields.js"></script>
</head>
<body>
  <main>
    <h1>Form fields</h1>
    <p>Native data-entry controls for compact, themeable product surfaces.</p>
    <section class="surface" aria-label="Form field states">
      <label>Project name<worn-input aria-label="Project name" placeholder="Acme migration"></worn-input></label>
      <label>Email<worn-input aria-label="Email" type="email" autocomplete="email" placeholder="priya@acme.com"></worn-input></label>
      <label>Context<worn-textarea aria-label="Context" rows="2" placeholder="Add context for the team."></worn-textarea></label>
      <label class="compact">Workspace<worn-select aria-label="Workspace" options='[{"value":"long","label":"An intentionally very long workspace name that must remain contained"},{"value":"short","label":"Acme"}]' value="long"></worn-select></label>
      <label class="compact">Progress<worn-range aria-label="Progress" value="65" suffix="%"></worn-range></label>
      <label>Read only<worn-input aria-label="Read only" value="Imported from GitHub" readonly></worn-input></label>
      <label>Disabled<worn-input aria-label="Disabled" value="Managed externally" disabled></worn-input></label>
    </section>
    <output id="state" aria-live="polite">No changes yet.</output>
  </main>
  <script>
    const output = document.querySelector('#state');
    document.addEventListener('input', (event) => {
      if (!event.target.matches('worn-input, worn-textarea, worn-select, worn-range')) return;
      output.textContent = `${event.target.localName}: ${event.target.value}`;
    });
    document.addEventListener('change', (event) => {
      if (!event.target.matches('worn-select')) return;
      output.textContent = `${event.target.localName}: ${event.target.value}`;
    });
  </script>
</body>
</html>
