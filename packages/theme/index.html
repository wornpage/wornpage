<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@wornpage/theme Demo</title>
<style>
  :root,
  [data-theme="light"] {
    --bg: #f5f0e8; --surface: #fdfbf7; --text: #21322b;
    --muted: #506058; --border: #e2ddd5; --link: #0f766e; --accent: #0f766e;
  }
  [data-theme="dark"] {
    --bg: #0f1714; --surface: #18241f; --text: #f7fffc;
    --muted: #b0bcb4; --border: #3a4d45; --link: #7ddac3; --accent: #2f7665;
  }
  [data-theme="forest"] {
    --bg: #1c251a; --surface: #263226; --text: #e8f2e0;
    --muted: #b6c2b8; --border: #3f523b; --link: #96cb86; --accent: #3f7a32;
  }
  [data-theme="ocean"] {
    --bg: #0f1d2c; --surface: #182c42; --text: #e6eff7;
    --muted: #acc0d1; --border: #2f4a65; --link: #93c2e3; --accent: #2563a0;
  }
  [data-theme="sepia"] {
    --bg: #2d241a; --surface: #3c3226; --text: #efe0cc;
    --muted: #d0bca9; --border: #504234; --link: #e3b886; --accent: #8b5e2c;
  }
  /* Seasonal themes layer an accent over the dark base. */
  [data-theme="halloween"] {
    --bg: #0f1714; --surface: #18241f; --text: #f7fffc;
    --muted: #b0bcb4; --border: #3a4d45; --link: #fb923c; --accent: #c2410c;
  }
  [data-theme="winter"] {
    --bg: #0f1714; --surface: #18241f; --text: #f7fffc;
    --muted: #b0bcb4; --border: #3a4d45; --link: #93c5fd; --accent: #1d4ed8;
  }
  [data-theme="holiday"] {
    --bg: #0f1714; --surface: #18241f; --text: #f7fffc;
    --muted: #b0bcb4; --border: #3a4d45; --link: #f9a8d4; --accent: #be185d;
  }

  worn-theme {
    --wrn-theme-active-bg: var(--accent);
    --wrn-theme-active-text: #fff;
    --wrn-theme-border: var(--border);
    --wrn-theme-focus: var(--link);
    --wrn-theme-hover: var(--surface);
    --wrn-theme-text: var(--text);
  }

  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    transition: background 160ms ease, color 160ms ease;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { margin: 0 0 18px; font-size: 24px; line-height: 1.2; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 20px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 16px; line-height: 1.3; }
  .panel a { color: var(--link); }
  .samples { align-items: center; display: flex; gap: 12px; }
  .pill {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
  }
  .swatches { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .sw {
    width: 62px; height: 54px; border-radius: 8px;
    border: 1px solid var(--border);
    display: grid; place-items: end center;
    font-size: 10px; color: var(--muted); padding-bottom: 3px;
  }
  .sw-bg { background: var(--bg); }
  .sw-surface { background: var(--surface); }
  .sw-accent { background: var(--accent); }
  .sw-link { background: var(--link); }
  .sw-border { background: var(--border); }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>@wornpage/theme</h1>

  <worn-theme id="theme-el"></worn-theme>

  <div class="panel">
    <h2>Palette</h2>
    <div class="samples"><span class="pill">Accent</span><a href="#preview">Link</a></div>
    <div class="swatches">
      <div class="sw sw-bg">Background</div>
      <div class="sw sw-surface">Surface</div>
      <div class="sw sw-accent">Accent</div>
      <div class="sw sw-link">Link</div>
      <div class="sw sw-border">Border</div>
    </div>
  </div>
</main>

<script type="module" src="./dist/worn-theme.js"></script>
</body>
</html>
