<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@wornpage/undo demo</title>
  <style>
    :root {
      --cockpit-bg: #f5f3ef;
      --cockpit-surface: #fff;
      --cockpit-border: #d5d0c8;
      --cockpit-text: #21322b;
      --cockpit-accent: #0d9488;
      --cockpit-accent-text: #fff;
    }
    body { margin: 0; padding: 32px; background: var(--cockpit-bg); color: var(--cockpit-text); font-family: system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; }
    h1 { margin: 0 0 22px; font-size: 22px; }
    .state { margin-bottom: 12px; padding: 14px; border: 1px solid var(--cockpit-border); border-radius: 6px; background: var(--cockpit-surface); }
    .controls { display: flex; gap: 8px; margin-bottom: 18px; }
    .controls button { min-width: 44px; min-height: 40px; border: 1px solid var(--cockpit-border); border-radius: 6px; background: var(--cockpit-surface); color: inherit; cursor: pointer; font-size: 15px; }
    .controls button:first-child { border-color: var(--cockpit-accent); background: var(--cockpit-accent); color: var(--cockpit-accent-text); }
    worn-undo { display: block; }
    worn-undo[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>@wornpage/undo</h1>
    <div class="state">Value: <strong id="value">0</strong></div>
    <div class="controls">
      <button type="button" data-delta="1" aria-label="Increase value">+1</button>
      <button type="button" data-delta="-1" aria-label="Decrease value">-1</button>
    </div>
    <worn-undo id="undo" packid="demo-state" hidden></worn-undo>
  </main>

  <script type="module" src="./dist/worn-undo.js"></script>
  <script type="module">
    const output = document.getElementById('value');
    const receipt = document.getElementById('undo');
    let value = 0;
    let previous = null;

    function render() {
      output.textContent = String(value);
    }

    document.querySelectorAll('[data-delta]').forEach((button) => {
      button.addEventListener('click', () => {
        previous = value;
        value += Number(button.dataset.delta);
        receipt.label = `Changed ${previous} to ${value}`;
        receipt.hidden = false;
        render();
      });
    });

    receipt.addEventListener('wrn-undo', () => {
      if (previous === null) return;
      value = previous;
      previous = null;
      receipt.hidden = true;
      render();
    });
  </script>
</body>
</html>
