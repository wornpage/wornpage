<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>@wornpage/undo demo</title>
  <style>
    :root {
      --cockpit-bg: #f5f3ef;
      --cockpit-surface: #fff;
      --cockpit-border: #d5d0c8;
      --cockpit-text: #21322b;
      --cockpit-muted: #596a61;
      --cockpit-subtle: #eaf4f0;
      --cockpit-accent: #0d9488;
      --cockpit-accent-text: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 0;
      margin: 0;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--cockpit-bg);
      color: var(--cockpit-text);
      font-family: system-ui, sans-serif;
    }
    main { width: min(100%, 480px); min-width: 0; margin: 0 auto; }
    h1 { margin: 0 0 22px; font-size: 22px; }
    .state { margin-bottom: 12px; padding: 14px; border: 1px solid var(--cockpit-border); border-radius: 6px; background: var(--cockpit-surface); }
    .controls { display: flex; gap: 8px; margin-bottom: 18px; }
    .controls button { min-width: 44px; min-height: 44px; border: 1px solid var(--cockpit-border); border-radius: 6px; background: var(--cockpit-surface); color: inherit; cursor: pointer; font-size: 16px; touch-action: manipulation; }
    .controls button:first-child { border-color: var(--cockpit-accent); background: var(--cockpit-accent); color: var(--cockpit-accent-text); }
    worn-undo { display: block; }
    worn-undo[hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --cockpit-bg: #151a18;
        --cockpit-surface: #202825;
        --cockpit-border: #68746f;
        --cockpit-text: #f2f5f3;
        --cockpit-muted: #bdc8c2;
        --cockpit-subtle: #33413c;
        --cockpit-accent: #5eead4;
        --cockpit-accent-text: #10211c;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>@wornpage/undo</h1>
    <div class="state">Value: <strong id="value">0</strong></div>
    <div class="controls">
      <button type="button" data-delta="1" aria-label="Increase value">+1</button>
      <button type="button" data-delta="-1" aria-label="Decrease value">-1</button>
    </div>
    <worn-undo id="undo" packid="demo-state" hidden></worn-undo>
  </main>

  <script type="module" src="./dist/worn-undo.js"></script>
  <script type="module">
    const output = document.getElementById('value');
    const receipt = document.getElementById('undo');
    let value = 0;
    let previous = null;
    let next = null;

    function render() {
      output.textContent = String(value);
      receipt.canundo = previous !== null;
      receipt.canredo = next !== null;
      receipt.hidden = previous === null && next === null;
    }

    document.querySelectorAll('[data-delta]').forEach((button) => {
      button.addEventListener('click', () => {
        previous = value;
        value += Number(button.dataset.delta);
        next = null;
        receipt.label = `Changed ${previous} to ${value}`;
        render();
      });
    });

    receipt.addEventListener('wrn-undo', () => {
      if (previous === null) return;
      next = value;
      value = previous;
      previous = null;
      render();
    });

    receipt.addEventListener('wrn-redo', () => {
      if (next === null) return;
      previous = value;
      value = next;
      next = null;
      render();
    });
  </script>
</body>
</html>
