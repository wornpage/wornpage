<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@wornpage/receipt — Demo</title>
  <style>
    :root {
      --cockpit-bg: #f5f3ef;
      --cockpit-surface: #fff;
      --cockpit-border: #e0dcd5;
      --cockpit-radius: 8px;
      --cockpit-text: #1a1a1a;
      --cockpit-text-muted: #888;
      --cockpit-text-secondary: #555;
      --cockpit-hover-bg: rgba(0,0,0,0.05);
      --cockpit-accent: #0d9488;
    }
    body { font-family: system-ui; max-width: 480px; margin: 40px auto; padding: 0 20px; background: var(--cockpit-bg); }
    h1 { font-size: 20px; }
  </style>
  <link rel="stylesheet" href="data:text/css,.worn-receipt{margin-top:12px;border:1px solid var(--cockpit-border);border-radius:var(--cockpit-radius);background:var(--cockpit-surface);padding:12px 14px;display:grid;gap:8px}.worn-receipt-head{display:grid;gap:2px;border-bottom:1px solid var(--cockpit-border);padding-bottom:8px}.worn-receipt-head span{text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--cockpit-text-muted)}.worn-receipt-head strong{color:var(--cockpit-text);font-weight:560;font-size:14px}.worn-receipt-lines{display:grid;gap:0}.worn-receipt-lines>div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--cockpit-border)}.worn-receipt-lines>div:last-child{border-bottom:0}.worn-receipt-lines span{text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--cockpit-text-muted)}.worn-receipt-lines strong{color:var(--cockpit-text);font-weight:520;font-size:13px;overflow-wrap:anywhere}.worn-receipt-actions{display:flex;gap:8px;padding-top:4px}.worn-btn{align-items:center;background:transparent;border:1px solid var(--cockpit-border);border-radius:999px;color:var(--cockpit-text-secondary);cursor:pointer;display:inline-flex;font-size:12px;font-weight:560;gap:6px;padding:3px 10px;transition:background-color .12s ease}.worn-btn:hover{background:var(--cockpit-hover-bg);color:var(--cockpit-text)}">
</head>
<body>
  <h1>@wornpage/receipt</h1>
  <p>Undo-capable action receipt card. Shows what just happened and lets the user undo it.</p>

  <div class="worn-receipt" style="margin-top:20px">
    <div class="worn-receipt-head"><span>Last result</span><strong>Started "Venue hold calendar" — status is now active.</strong></div>
    <div class="worn-receipt-lines">
      <div><span>Status</span><strong>draft → active</strong></div>
      <div><span>Next action</span><strong>Call venue manager</strong></div>
    </div>
    <div class="worn-receipt-actions">
      <button class="worn-btn" onclick="alert('Undo!')">Undo</button>
      <button class="worn-btn">Dismiss</button>
    </div>
  </div>
</body>
</html>
