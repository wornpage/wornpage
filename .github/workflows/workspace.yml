name: Wornpage workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Node for Playwright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0

      - name: Check workspace dependency contract
        run: bun run check:workspace

      - name: Check every component delivery contract
        run: bun run check:components

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install catalog Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify packages and rendered catalog
        run: bun run verify:catalog

      - name: Upload catalog verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-verification-${{ github.run_attempt }}
          path: output/verify-catalog/
          if-no-files-found: warn
          retention-days: 14
