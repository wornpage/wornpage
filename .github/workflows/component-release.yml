name: Component release verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - name: Disable unused Google Chrome APT sources
        shell: bash
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [[ -f "$source" ]]; then
              mv "$source" "$source.disabled"
            fi
          done
          active_chrome_sources="$(grep -RIl --include='*.list' --include='*.sources' -E '(^|[^[:alnum:]])(dl\.google\.com/linux/chrome|google-chrome)([^[:alnum:]]|$)' /etc/apt/sources.list.d /etc/apt/sources.list 2>/dev/null || true)"
          if [[ -n "$active_chrome_sources" ]]; then
            echo "Unexpected active Google Chrome APT source(s):"
            printf '%s\n' "$active_chrome_sources"
            exit 1
          fi

      - run: bunx playwright install --with-deps chromium
      - run: bun run verify:catalog
      - name: Upload full-catalog packages and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/components/
            output/verify-catalog/
          if-no-files-found: warn
          retention-days: 14
