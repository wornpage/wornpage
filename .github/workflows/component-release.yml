name: Component release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: component-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify:catalog
      - name: Prepare immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/prepare-component-release.ts
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(bun -p "require('./components-release.json').tag")
          gh release edit "$tag" --repo wornpage/wornpage --draft=false
